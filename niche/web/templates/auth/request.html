{% extends "base.html" %}
{% block title %}Sign in — {{ feed_name }}{% endblock %}
{% block content %}
<div style="max-width:380px; margin:4rem auto;">
  <h1 style="margin-bottom:0.5rem;">Sign in</h1>
  <p class="meta" style="margin-bottom:2rem;">We'll email you a sign-in link. No password needed.</p>

  {% if error %}
  <div class="flash error" style="margin-bottom:1rem; border-radius:6px;">{{ error }}</div>
  {% endif %}

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autofocus required placeholder="you@example.com">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Send sign-in link</button>
  </form>
</div>
{% endblock %}

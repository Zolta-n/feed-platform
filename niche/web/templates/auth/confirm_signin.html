{% extends "base.html" %}
{% block title %}Sign in — {{ feed_name }}{% endblock %}
{% block content %}
<div style="max-width:420px; margin:4rem auto;">
  <h1 style="margin-bottom:0.5rem;">Sign in</h1>
  <p class="meta" style="margin-bottom:2rem;">You're signing in as <strong>{{ email }}</strong>.</p>

  <form method="post" action="{{ url_for('auth.verify') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit" class="btn btn-primary" style="width:100%;">Continue to {{ feed_name }}</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="empty-state">
  <h1>No digest yet</h1>
  {% if current_user.is_authenticated and current_user.is_admin %}
    <p style="margin-top:1rem;">Run the pipeline to generate the first digest.</p>
    <form method="post" action="{{ url_for('admin.run_pipeline') }}" style="margin-top:1.25rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-primary">▶ Run pipeline</button>
    </form>
  {% else %}
    <p style="margin-top:1rem;">Your digest is being prepared. Check back soon.</p>
  {% endif %}
</div>
{% endblock %}

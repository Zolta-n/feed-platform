<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Georgia, serif; background: #0f1117; color: #e2e4ed; padding: 2rem; max-width: 520px; margin: 0 auto;">
  <h1 style="font-size: 1.3rem; margin-bottom: 0.5rem;">{{ feed_name }}</h1>
  <p style="color: #7b7f99; font-size: 0.875rem; margin-bottom: 2rem;">{{ tagline }}</p>
  <p style="margin-bottom: 1.5rem;">Click the button below to sign in. This link expires in 15 minutes.</p>
  <a href="{{ link }}" style="display: inline-block; background: #2563eb; color: #fff; padding: 0.65rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-family: sans-serif;">Sign in to {{ feed_name }}</a>
  <p style="margin-top: 2rem; color: #7b7f99; font-size: 0.8rem;">Or copy this link: {{ link }}</p>
  <p style="color: #7b7f99; font-size: 0.75rem; margin-top: 2rem;">If you didn't request this, ignore this email.</p>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Georgia, serif; background: #0f1117; color: #e2e4ed; padding: 2rem; max-width: 520px; margin: 0 auto;">
  <h1 style="font-size: 1.3rem; margin-bottom: 1.5rem;">New user request — {{ feed_name }}</h1>
  <p style="margin-bottom: 1rem;"><strong>{{ email }}</strong> has requested access to {{ feed_name }}.</p>
  <p style="margin-bottom: 1.5rem;">Click the button below to approve them.</p>
  <a href="{{ approval_link }}" style="display: inline-block; background: #34d399; color: #0f1117; padding: 0.65rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-family: sans-serif;">Approve user</a>
  <p style="margin-top: 2rem; color: #7b7f99; font-size: 0.8rem;">Or copy this link: {{ approval_link }}</p>
  <p style="color: #7b7f99; font-size: 0.75rem; margin-top: 1rem;">This link expires in 72 hours.</p>
</body>
</html>

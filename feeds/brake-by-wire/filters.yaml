version: 1

# Drop articles older than 1 year — keeps the digest fresh and prevents
# Google News and similar aggregators from surfacing 2023-era results.
# Items with no published_at are kept (benefit of the doubt).
max_age_days: 365

# require_any: at least one phrase must match (title OR body).
# Acts as a topical gate — articles that never mention any brake-related
# term get dropped before we spend LLM tokens on them.
# Multi-language phrases so non-English RSS sources (Electrive DE, Chinese)
# survive the pre-translate filter pass.
require_any:
  match_fields: [title, body]
  phrases:
    # English
    - brake
    - brakes
    - braking
    - regen
    - regenerative
    - ABS
    - ESC
    - EBS
    - AEB
    - actuator
    - caliper
    - rotor
    - stopping distance
    - by-wire
    - by wire
    - iBooster
    - EHB
    # German (Electrive DE, Automotive World DE coverage)
    - Bremse
    - Bremsen
    - Bremsanlage
    - Bremssystem
    - Bremspedal
    - Bremsbelag
    - Bremssattel
    - Rekuperation
    # Chinese (CarNewsChina, CnEVPost, Gasgoo)
    - 刹车
    - 制动
    - 刹车系统
    - 制动系统
    - 线控制动
    # French / Spanish / Italian / Japanese / Korean (low-volume but cheap to include)
    - frein
    - freinage
    - freno
    - frenata
    - ブレーキ
    - 브레이크

# block: any matching phrase drops the item outright.
# Title-only by default — bodies often contain incidental mentions
# (e.g. an article about passenger-car brakes may quote a comparison
# to a "transit bus" — we don't want to drop that).
block:
  match_fields: [title]
  phrases:
    - class 8 truck
    - heavy-duty truck
    - heavy duty truck
    - transit bus
    - coach
    - lorry
    - semi-trailer
    - semi truck
    - freight hauler
    - e-bike
    - ebike
    - motorcycle
    - moped
    - scooter

name: Build and Push Docker Image

# Builds the container image and pushes it to GHCR on every push to the deploy branch.
# Watchtower on the NAS detects the new :latest and redeploys within ~5 minutes.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/zolta-n/feed-platform:latest
